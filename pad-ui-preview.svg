<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">پیش‌نمایش رابط گرافیکی PAD</title>
  <desc id="desc">نمای فارسیِ کارت PAD نصب‌شده شامل شماتیک سه‌بعدی هدر، شاخه و پد زینی، محورهای محاسبه‌شده و داده‌های snapshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c31"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#080e19"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/><stop offset="0.19" stop-color="#64748b"/><stop offset="0.47" stop-color="#334155"/><stop offset="0.76" stop-color="#64748b"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/><stop offset="0.32" stop-color="#94a3b8"/><stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="branchSteel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#334155"/><stop offset="0.18" stop-color="#cbd5e1"/><stop offset="0.47" stop-color="#64748b"/><stop offset="0.78" stop-color="#dbeafe"/><stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="padGold" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fcd34d"/><stop offset="0.38" stop-color="#f59e0b"/><stop offset="0.78" stop-color="#b45309"/><stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="canvasBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101d32"/><stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243247"/><stop offset="1" stop-color="#1b283b"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1" opacity=".45"/>
      <circle cx="0" cy="0" r="1.2" fill="#334155" opacity=".7"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020617" flood-opacity=".34"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#fde68a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#86efac"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", Tahoma, sans-serif; }
      .fa { direction: rtl; unicode-bidi: plaintext; }
      .muted { fill:#94a3b8; }
      .white { fill:#e2e8f0; }
      .small { font-size:12px; }
      .tiny { font-size:10px; }
      .number { font-family: "DejaVu Sans", Tahoma, sans-serif; font-variant-numeric:tabular-nums; }
      .dim { font-size:11px; font-weight:700; }
    </style>
