  <text x="1144" y="823" class="fa" fill="#cbd5e1" font-size="9.5" text-anchor="end">برش ضخامت‌دار شاخه، جبران دیواره، آماده‌سازی جوش، Fit-up و تلرانس ساخت مدل نشده‌اند؛ فقط β=۹۰° و آفست صفر.</text>
  <text x="1144" y="840" class="fa" fill="#cbd5e1" font-size="9.5" text-anchor="end">چرخش نما فقط دوربین را می‌چرخاند؛ θ یا چرخش فیزیکی قطعه نیست.</text>

