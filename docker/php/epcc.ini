; ---------------------------------------------------------------------------
; EPCC Platform - PHP settings for the development container.
;
; These are the same limits restore.sh applies to the bare sandbox. They live
; in a file rather than in the Dockerfile so the two environments can be
; diffed against each other at a glance: if a number changes here, change it
; there too.
;
; WHY THESE NUMBERS
;   The document register accepts CAD files and scanned drawing sets. PHP's
;   stock 2M upload cap rejects nearly every real deliverable, and it fails
;   SILENTLY - an invalid UploadedFile with no exception thrown. 100M/110M is
;   what the register was designed against.
;
;   memory_limit 512M: the MTO staging and roll-up paths hold whole revisions
;   in memory while they hash and diff rows.
;
; DELIBERATELY ABSENT: date.timezone. The image default (UTC) is what the
;   suite was written and greened against, and Jalali conversion is done in
;   application code (App\Support\JalaliDate), not by PHP's date functions.
; Setting a timezone here would shift every timestamp assertion for no gain.
; ---------------------------------------------------------------------------

upload_max_filesize = 100M
post_max_size = 110M
memory_limit = 512M
max_file_uploads = 30
max_execution_time = 300

; Composer and the PDF renderer both shell out; a larger realpath cache stops
; the vendor tree from being re-walked on every include.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
