# ---------------------------------------------------------------------------
# EPCC Platform - continuous integration
#
# Four things are verified, and the split mirrors prototype/test/run-all.sh so
# that "green in CI" and "green locally" mean the same thing:
#
#   static     standards-pack validator + rule-engine conformance corpus
#   laravel    the full PHPUnit suite against a real PostgreSQL 17 with RLS
#   prototype  the jsdom harnesses over prototype/*.html
#   image      the development image still builds and still contains the PDF
#              toolchain, and compose.yaml still parses
#
# TWO RULES THIS FILE IS BUILT AROUND
#
# 1. No silent skips. PdfExportTest and VendorTransmittalTest call
#    markTestSkipped() when a headless browser, poppler-utils or Vazirmatn is
#    missing, and PHPUnit STILL EXITS ZERO. REBUILD.md §4 records 13 tests
#    vanishing that way. The `laravel` job installs the toolchain, verifies it,
#    and then fails the build if the summary line reports a single skip.
#
# 2. The application database role is NOT a superuser. A superuser bypasses
#    row-level security even with FORCE ROW LEVEL SECURITY, so a CI database
#    wired up the convenient way would turn the tenancy assertions -
#    SeedPathTest's "unbound read must be fail-closed" among them - red, and
#    invite someone to weaken them. See docker/postgres/init/01-*.sql.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 8.4, not the ^8.3 that composer.json advertises: composer.lock resolved
  # Symfony 8.1, and 18 of those packages require php >=8.4.1, so `composer
  # install` on 8.3 fails with "lock file does not contain a compatible set of
  # packages". REBUILD.md and restore.sh already say 8.4. See the Dockerfile.
  PHP_VERSION: "8.4"

jobs:
  # -------------------------------------------------------------------------
  # Standards packs and the framework-free rule engine. No database, no vendor
  # directory: packages/standards-engine has no dependencies by design
  # (ADR-003 Annex A §6), so this job stays fast enough to be worth running
  # first.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Did this push touch code? A docs-only push cannot break the suite, and the
  # Laravel job costs ~64 minutes, so running it for a markdown change buys an
  # hour of wall clock in exchange for no information.
  #
  # Safety first: anything we cannot PROVE is docs-only runs everything. A
  # workflow_dispatch has no `before`, a new branch has an all-zero `before`,
  # and a diff we fail to read all fall through to the full run.
  # -------------------------------------------------------------------------
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.changed.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        name: Classify the push
        run: |
          set -uo pipefail
          code=true
          if [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            case "$base" in
              ""|0000000000000000000000000000000000000000)
                ;; # unknown base: assume code, run everything
              *)
                if files=$(git diff --name-only "$base" "${{ github.sha }}" 2>/dev/null) && [ -n "$files" ]; then
                  # docs-only == every changed path is under docs/ or a root-level .md
                  if ! printf '%s\n' "$files" | grep -qvE '^(docs/.*|[^/]+\.md)$'; then
                    code=false
                  fi
                fi
                ;;
            esac
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changed paths treated as code: $code"

  static:
    name: Standards packs + rule engine
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install standards-pack schema validator
        run: python3 -m pip install 'jsonschema>=4.20,<5'

      - name: Validate the standards packs
        run: python3 standards-packs/validate_packs.py

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Run the rule-engine conformance corpus
        run: php packages/standards-engine/conformance/run.php

      - name: Run read-only material screening regression and CLI smoke
        run: |
          php scripts/tests/test_material_screening.php
          php scripts/screen-material.php docs/examples/material-screening-synthetic.json > /tmp/material-screening.json
          python3 -c "import json; r=json.load(open('/tmp/material-screening.json')); assert r['engineering_approved'] is False and r['automatic_consumption_allowed'] is False"
          php scripts/screen-material.php docs/examples/material-screening-synthetic.json --html > /tmp/material-screening.html
          grep -q '<!doctype html>' /tmp/material-screening.html

  # -------------------------------------------------------------------------
  # The jsdom harnesses over the HTML prototype. jsdom comes from the ROOT
  # package.json (not app/), which is why cache-dependency-path points there.
  # -------------------------------------------------------------------------
  prototype:
    name: HTML prototype
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install jsdom
        run: npm ci --no-audit --no-fund

      - name: Render matrix
        run: node prototype/test/render.test.js

      - name: Sidebar, piping workspace and MTO acceptance previews
        run: npm run test:prototype

  # Pure PCF tests run independently of migrations so a schema integration
  # failure cannot conceal parser/admission/classification regressions.
  pcf:
    name: Pure PCF parser and classification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2
      - name: Install Composer dependencies
        working-directory: app
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist
      - name: Run pure PCF tests (no database)
        working-directory: app
        run: |
          set -euo pipefail
          if ! output="$(vendor/bin/phpunit --colors=never --filter 'Pcf(Parser|Admission|BranchClassification)Test' 2>&1)"; then
            printf '%s\n' "$output"
            detail="$(printf '%s' "$output" | tail -c 3500 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
            echo "::error title=Pure PCF test failure::$detail"
            exit 1
          fi
          printf '%s\n' "$output"

  # -------------------------------------------------------------------------
  # The real suite: PostgreSQL 17, RLS, and the PDF toolchain.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # The suite: 2028 tests, ~64 minutes serially. Two things make it expensive
  # and both are deliberate:
  #
  #   * 121 of 145 test classes rebuild all 100 migrations inside setUp(),
  #     because some tests spawn real worker processes (PipingCustodyTest,
  #     InspectionNotification*) that open their own connection and so cannot
  #     see an uncommitted transaction. RefreshDatabase's usual trick is
  #     therefore unavailable: each test needs genuinely committed data.
  #     Measured cost of that choice: 1.52 s per test, and 86% of the tests pay
  #     it - about 97% of the 64 minutes is rebuilding the same database.
  #   * PostgreSQL 17 runs natively on the runner rather than as a service
  #     container, because those workers need the app's DB host to be a Unix
  #     socket under /tmp/epcc-, and a container's /tmp is not the runner's.
  #
  # Making each test cheaper means auditing 121 classes by hand (deferred, and
  # worth doing later). So the wall clock is cut the way that cannot change
  # what is being tested: split the classes into SHARDS balanced by test count
  # and run them in parallel. Each shard uploads its JUnit log; `laravel-report`
  # merges them and owns the verdict, so the gate - including the "no skips"
  # rule - is exactly as strict as the single job it replaces.
  # -------------------------------------------------------------------------
  laravel:
    name: Laravel suite ${{ matrix.shard }}/4 (PostgreSQL + RLS)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false # one red shard must not rob us of the other three
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, intl, bcmath, gd, zip, pcntl, sockets, mbstring, exif
          tools: composer:v2
          coverage: none

      # ---- the PDF toolchain -------------------------------------------------
      # poppler-utils gives pdffonts/pdftotext. Vazirmatn comes from the archive
      # where the distro has it and from the upstream npm tarball where it does
      # not - either way the step ends by proving fontconfig can see the family,
      # because PdfExportTest asserts on `pdffonts` output by NAME.
      - name: Install poppler-utils and Vazirmatn
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fontconfig fonts-dejavu-core
          if ! sudo apt-get install -y --no-install-recommends fonts-vazirmatn; then
            echo "fonts-vazirmatn is not in this archive - installing from the npm release tarball"
            tmp="$(mktemp -d)"
            ( cd "$tmp" \
              && npm pack vazirmatn@33.0.3 --silent \
              && tar xzf vazirmatn-*.tgz \
              && sudo mkdir -p /usr/share/fonts/truetype/vazirmatn \
              && sudo cp package/fonts/ttf/Vazirmatn-*.ttf /usr/share/fonts/truetype/vazirmatn/ )
            sudo fc-cache -f
          fi
          fc-list | grep -qi vazirmatn || { echo "::error::Vazirmatn is not visible to fontconfig"; exit 1; }
          echo "Vazirmatn: $(fc-list | grep -i vazirmatn | head -1)"

      # PdfRenderer searches this exact list, in this order. GitHub's Ubuntu
      # runners ship google-chrome-stable; the apt `chromium` package on Ubuntu
      # is a snap stub and is not usable inside a workflow.
      - name: Verify a headless browser is reachable
        run: |
          set -euo pipefail
          for candidate in chromium chromium-browser google-chrome google-chrome-stable headless-shell; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "PDF renderer will use: $candidate ($($candidate --version 2>/dev/null || true))"
              exit 0
            fi
          done
          echo "::error::No headless browser found. The 13 PDF tests would SILENTLY SKIP."
          exit 1

      # ---- the database ------------------------------------------------------
      # PostgreSQL 17 runs NATIVELY on the runner, not as a service container:
      # the concurrency tests spawn real worker processes that refuse to run
      # unless the app's DB host is a Unix-socket directory under /tmp/epcc-
      # (see the guards in PipingCustodyTest / InspectionNotification* tests).
      # A service container's /tmp is not the runner's /tmp, so no socket
      # mapping can satisfy them - 34 such refusals were the bulk of the
      # 2026-10-26T11:41 CI failure.
      - name: Install PostgreSQL 17 with the /tmp/epcc-pg isolation socket
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-17
          # One cluster, our config, port 5432: drop whatever the image or the
          # package auto-created, then rebuild.
          pg_lsclusters -h | awk '{print $1, $2}' | while read -r ver name; do
            sudo pg_dropcluster --stop "$ver" "$name" || true
          done
          sudo pg_createcluster -p 5432 17 main
          sudo mkdir -p /tmp/epcc-pg
          sudo chown postgres:postgres /tmp/epcc-pg
          sudo sed -i "s|^unix_socket_directories.*|unix_socket_directories = '/var/run/postgresql,/tmp/epcc-pg'|" /etc/postgresql/17/main/postgresql.conf
          # Password auth for epcc ON THE SOCKET (the default 'peer' would tie
          # the DB user to an OS user and the workers connect as `user`).
          sudo sed -i 's|^local\s\+all\s\+all\s\+peer|local   epcc            epcc                                    scram-sha-256\nlocal   epcc_test       epcc                                    scram-sha-256\nlocal   all             all                                     peer|' /etc/postgresql/17/main/pg_hba.conf
          sudo pg_ctlcluster 17 main start
          sudo -u postgres psql -h /var/run/postgresql -tAc "SHOW unix_socket_directories" | grep -q '/tmp/epcc-pg'
          ls /tmp/epcc-pg/.s.PGSQL.5432

      - name: Create the non-superuser epcc role and both databases
        run: |
          set -euo pipefail
          sudo -u postgres psql -h /var/run/postgresql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE epcc LOGIN PASSWORD 'epcc_dev';
          CREATE DATABASE epcc OWNER epcc;
          CREATE DATABASE epcc_test OWNER epcc;
          \connect epcc
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          \connect epcc_test
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          SQL
          # Prove the posture the whole tenancy model depends on: a superuser
          # would bypass RLS and the fail-closed assertions would go red.
          # Counted rather than concatenated - PostgreSQL has no text||boolean
          # operator, so building the message inline just errors out.
          sudo -u postgres psql -h /var/run/postgresql -c \
            "select rolname, rolsuper, rolbypassrls, rolcreatedb, rolcreaterole from pg_roles where rolname = 'epcc'"
          role_ok="$(sudo -u postgres psql -h /var/run/postgresql -tAc \
            "select count(*) from pg_roles where rolname = 'epcc' and not rolsuper and not rolbypassrls")"
          [ "$role_ok" = "1" ] \
            || { echo "::error::the epcc role must exist and be neither superuser nor BYPASSRLS"; exit 1; }
          echo "epcc role posture verified (non-superuser, no BYPASSRLS)"

      # ---- dependencies and .env ---------------------------------------------
      # --no-scripts, then the artisan steps explicitly: composer's
      # post-autoload-dump boots Laravel, and a boot before .env exists
      # configures the app from defaults (DB_CONNECTION=sqlite).
      - name: Install Composer dependencies
        working-directory: app
        run: composer install --no-scripts --no-interaction --no-progress --prefer-dist

      - name: Point Laravel at PostgreSQL (isolated socket, debug off)
        working-directory: app
        run: |
          set -euo pipefail
          cp .env.example .env
          # Replace, do not append: Dotenv keeps the FIRST of a duplicated key.
          # .env.example ships the pgsql dev defaults (epcc/epcc_dev, db epcc);
          # CI overrides exactly two things:
          #  - DB_HOST -> the /tmp/epcc-pg socket dir the worker guards require
          #  - APP_DEBUG=false -> debug error pages echo request data, which
          #    legitimately fails the leak-marker assertions in the 422-family
          #    filter tests (part of the 2026-10-26T11:41 CI failure).
          sed -i 's|^DB_HOST=.*|DB_HOST=/tmp/epcc-pg|' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          grep -E '^(APP_ENV|APP_DEBUG|DB_)' .env

      - name: Generate APP_KEY
        working-directory: app
        run: php artisan key:generate --force --no-interaction

      - name: Migrate and seed the development database
        working-directory: app
        run: |
          set -euo pipefail
          # GitHub annotations remain readable through the API even when the
          # runner-log download host is unavailable in an air-gapped sandbox.
          run_or_annotate() {
            local output
            if ! output="$("$@" 2>&1)"; then
              printf '%s\n' "$output"
              local last
              last="$(printf '%s' "$output" | tail -c 3500 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
              echo "::error title=Database bootstrap failed::$last"
              return 1
            fi
            printf '%s\n' "$output"
          }
          run_or_annotate php artisan migrate:fresh --force --seed --no-interaction
          run_or_annotate php artisan db:seed --class=ProcurementSeeder --force --no-interaction
          run_or_annotate php artisan filament:assets --no-interaction

      # ---- the suite ---------------------------------------------------------
      # PHPUnit directly rather than `artisan test`, for two reasons: it writes
      # a JUnit log that the next step can parse structurally, and it avoids
      # Collision's ANSI formatting, which phpunit.xml enables with
      # colors="true" and which would wrap the summary line in escape codes.
      # Locally, scripts/dev-test.sh keeps using `artisan test` because that
      # output is nicer to read - and its gate handles both summary shapes.
      - name: Run this shard of the suite
        working-directory: app
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
          # A cold headless Chrome on a shared runner can take longer than the
          # default 30s render budget, and a PDF test that fails because the
          # host was busy is a flake, not a finding. Same documents, same
          # assertions, more patience: production keeps the 30s default.
          EPCC_PDF_TIMEOUT_SECONDS: "90"
        run: |
          set -uo pipefail
          php artisan config:clear --no-interaction >/dev/null 2>&1 || true

          # Balanced, deterministic, self-maintaining: group the tests by class,
          # then fill the emptiest shard in sorted order. A hand-maintained list
          # of files would go stale the first time someone adds a test class.
          python3 - <<'PY'
          import os, re, subprocess

          listing = subprocess.run(
              ['vendor/bin/phpunit', '--list-tests'], capture_output=True, text=True
          ).stdout

          counts = {}
          for line in listing.splitlines():
              m = re.match(r'\s*-\s+(.+?)::', line)
              if m:
                  cls = m.group(1).split('\\')[-1]
                  counts[cls] = counts.get(cls, 0) + 1

          if not counts:
              raise SystemExit('phpunit listed no tests - refusing to report a green shard')

          total = sum(counts.values())
          shards = int(os.environ['SHARDS'])
          index = int(os.environ['SHARD']) - 1
          buckets = [[] for _ in range(shards)]
          load = [0] * shards
          for cls in sorted(counts):
              i = min(range(shards), key=lambda k: (load[k], k))
              buckets[i].append(cls)
              load[i] += counts[cls]

          # Anchored on the namespace separator: without it, 'WarehouseTest'
          # also matches 'PipingWarehouseTest', and 24 tests ran in two shards.
          pattern = '/(?:\\\\)(' + '|'.join(buckets[index]) + ')::/'
          open('shard-filter.txt', 'w').write(pattern)
          print(f'shard {index + 1}/{shards}: {len(buckets[index])} classes, '
                f'{load[index]} of {total} tests (loads: {load})')
          PY

          # A shard that somehow produced no filter must not silently run the
          # whole suite (or, worse, nothing): that is how a green build lies.
          if [ ! -s shard-filter.txt ]; then
            echo "::error::shard filter was not produced - refusing to run"
            exit 1
          fi
          FILTER="$(cat shard-filter.txt)"
          echo "filter length: ${#FILTER} chars"

          vendor/bin/phpunit --colors=never --filter "$FILTER" --log-junit "../junit-${SHARD}.xml" 2>&1 | tee "../test-output-${SHARD}.log"
          code="${PIPESTATUS[0]}"
          echo "$code" > "../phpunit-exit-code-${SHARD}"
          echo "PHPUnit exit code: $code (0=success, 1=failures, 2=errors)"
          # Deliberately not `exit $code`: `laravel-report` owns the verdict, so
          # that failures are annotated even when this shard is red.
          exit 0

      - name: Upload this shard's JUnit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-junit-${{ matrix.shard }}
          path: junit-${{ matrix.shard }}.xml
          if-no-files-found: error # a shard that ran no tests must not look green
          retention-days: 7

      - name: Upload the suite output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-test-output-${{ matrix.shard }}
          path: test-output-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 14

  # -------------------------------------------------------------------------
  # One verdict for the whole suite, exactly as strict as the single job it
  # replaces: every failure and error becomes an annotation, and a skipped test
  # fails the run (REBUILD.md §4 - markTestSkipped() exits zero).
  #
  # It also fixes a counting bug that job had: PHPUnit's JUnit log nests
  # <testsuite> elements, and summing root.iter('testsuite') counted every suite
  # once as a parent and again through its children - the run of 2026-10-30 was
  # announced as "6183 tests" when phpunit itself reported 2028. Counting only
  # the top level reports the truth.
  # -------------------------------------------------------------------------
  laravel-report:
    name: Laravel suite — verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: laravel
    if: always() && needs.laravel.result != 'skipped'
    env:
      ALLOW_SKIPS: "0"
      EXPECT_SHARDS: "4"
      SHARD_RESULT: ${{ needs.laravel.result }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: laravel-junit-*
          merge-multiple: true

      - name: Merge, annotate, gate
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET

          def emit(level, title, msg):
              # Workflow-command escaping: % first, then the control chars.
              clean = lambda t: str(t).replace('%', '%25').replace(':', '%3A').replace(',', '%2C').replace('\n', ' ').strip()
              msg = str(msg).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::{level} title={clean(title)[:180]}::{msg[:1200]}")

          files = sorted(glob.glob('junit-*.xml'))
          expected = int(os.environ['EXPECT_SHARDS'])
          bad = False

          if len(files) != expected:
              emit('error', 'missing shard logs',
                   f'expected {expected} JUnit logs, found {len(files)} ({files}). '
                   'A shard that crashed before writing its log is an environment '
                   'failure, not a green suite.')
              bad = True

          tests = assertions = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              # Top level only: a nested <testsuite> is already counted by its parent.
              for ts in root.findall('testsuite'):
                  tests += int(ts.get('tests', 0))
                  assertions += int(ts.get('assertions', 0))
                  failures += int(ts.get('failures', 0))
                  errors += int(ts.get('errors', 0))
                  skipped += int(ts.get('skipped', 0))

          print(f"Suite: tests={tests} assertions={assertions} "
                f"failures={failures} errors={errors} skipped={skipped} "
                f"across {len(files)} shard(s)")
          print(f"shards result: {os.environ.get('SHARD_RESULT', '?')}")

          if tests == 0:
              emit('error', 'no tests ran',
                   'the merged JUnit logs report zero tests - the suite did not collect.')
              bad = True

          annotated = 0
          for path in files:
              for tc in ET.parse(path).getroot().iter('testcase'):
                  for kind in ('failure', 'error'):
                      el = tc.find(kind)
                      if el is None:
                          continue
                      cls = tc.get('classname') or tc.get('class') or '?'
                      name = tc.get('name') or '?'
                      body = (el.get('message') or el.text or '').strip()
                      body = ' '.join(body.split()) or el.get('type', kind)
                      emit('error', f"{cls} {name}", f"[{kind}] {body}")
                      annotated += 1
                  if annotated >= 40:
                      break
              if annotated >= 40:
                  break
          if failures + errors > 40:
              print(f"::notice::{failures + errors - 40} more failing tests not annotated; "
                    "see the laravel-test-output-* artifacts")

          if failures or errors:
              emit('error', 'suite is red',
                   f"{failures} failure(s) and {errors} error(s) out of {tests} tests")
              bad = True
          if skipped and os.environ.get('ALLOW_SKIPS') != '1':
              emit('error', f'{skipped} test(s) SKIPPED',
                   'The suite is not proving what it claims to. Nearly always a missing PDF '
                   'toolchain (chromium, poppler-utils, Vazirmatn) - both are verified earlier '
                   'in this workflow.')
              bad = True
          if os.environ.get('SHARD_RESULT', 'success') != 'success':
              emit('error', 'a shard did not succeed',
                   f"the laravel matrix finished with result '{os.environ.get('SHARD_RESULT')}'; "
                   'see that job for the infrastructure or timeout failure behind it.')
              bad = True

          if bad:
              sys.exit(1)
          print(f"All green: {tests} tests, {assertions} assertions, 0 failures, 0 errors, 0 skipped.")
          PY

  # -------------------------------------------------------------------------
  # The development image itself. Cheap insurance that a Dockerfile edit did
  # not quietly drop the PDF toolchain, and that compose.yaml still parses.
  # -------------------------------------------------------------------------
  image:
    name: Development image + compose.yaml
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the development image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          push: false
          load: true
          tags: epcc/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-check the image
        run: |
          set -euo pipefail
          # --entrypoint is required. The image's ENTRYPOINT is the dev
          # bootstrap, so `docker run image php -v` would wait 60s for a
          # PostgreSQL that is not there and then exit 1 - testing the
          # entrypoint's database handling when the point of this step is
          # whether the TOOLCHAIN is in the image. Use SKIP_BOOTSTRAP=1 with
          # `docker compose run` to get a shell without the bootstrap.
          docker run --rm --entrypoint php epcc/app:ci -v | head -1
          docker run --rm --entrypoint composer epcc/app:ci --version
          docker run --rm --entrypoint node epcc/app:ci --version
          docker run --rm --entrypoint npm epcc/app:ci --version
          docker run --rm --entrypoint bash epcc/app:ci -c '
            set -euo pipefail
            command -v chromium
            command -v pdffonts
            command -v pdftotext
            command -v setpriv
            command -v psql
            command -v python3
            fc-list | grep -qi vazirmatn
            for ext in pdo_pgsql pgsql intl gd zip bcmath mbstring pcntl sockets; do
              php -m | grep -qxi "$ext" || { echo "MISSING EXTENSION: $ext"; exit 1; }
            done
            echo "PDF toolchain + Vazirmatn + PHP extensions OK inside the image"
          '

      - name: Validate compose.yaml
        run: docker compose config --quiet

      - name: Lint the entrypoint and dev scripts
        run: |
          set -euo pipefail
          bash -n docker/php/entrypoint.sh
          for f in scripts/dev-up.sh scripts/dev-down.sh scripts/dev-seed.sh scripts/dev-test.sh docker/php/entrypoint.sh; do
            shellcheck --severity=warning -x "$f"
          done

  # -------------------------------------------------------------------------
  # The claim this whole change makes is that `scripts/dev-up.sh` produces a
  # working system. The `image` job proves the toolchain is IN the image; this
  # one proves the stack BOOTS - the postgres init SQL, the entrypoint's .env
  # generation and dependency install, migrate:fresh --seed against a
  # non-superuser role, and `artisan serve` answering on port 8000.
  #
  # It also proves trap 6.1 for real rather than by argument: a sentinel table
  # is planted in the DEVELOPMENT database, a slice of the suite is run (which
  # calls migrate:fresh), and the sentinel must survive. If DB_DATABASE ever
  # leaked into the container environment, the suite would run against `epcc`
  # and drop it.
  # -------------------------------------------------------------------------
  stack:
    name: Compose stack boots and serves
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [changes, image]
    if: needs.changes.outputs.code == 'true' && needs.image.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Built with the gha cache the `image` job just populated, and tagged with
      # the name compose.yaml expects, so `up --no-build` uses it instead of
      # compiling the image a second time.
      - name: Build the image compose will run
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          push: false
          load: true
          tags: epcc/app:dev
          cache-from: type=gha

      - name: Bring the stack up and wait for healthy
        run: |
          set -euo pipefail
          docker compose up -d --no-build --wait --wait-timeout 1500
          docker compose ps

      - name: Prove the app serves the login page
        run: |
          set -euo pipefail
          code="$(curl -s -o /tmp/login.html -w '%{http_code}' http://localhost:8000/login)"
          echo "GET /login -> HTTP $code, $(wc -c < /tmp/login.html) bytes"
          [ "$code" = "200" ] || { echo "::error::/login returned $code"; exit 1; }
          grep -qi '<form' /tmp/login.html || { echo "::error::/login rendered no form"; exit 1; }

      # The two assertions that matter, straight from the database, as the
      # application role rather than as a superuser.
      - name: Prove the fixture is seeded and RLS is fail-closed
        run: |
          set -euo pipefail
          psql_q() {
            docker compose exec -T -e PGPASSWORD=epcc_dev db \
              psql -U epcc -d epcc -tAc "$1"
          }
          echo "role posture:      $(psql_q "select 'superuser='||rolsuper::text||' bypassrls='||rolbypassrls::text from pg_roles where rolname = current_user")"
          companies="$(psql_q 'select count(*) from companies')"
          projects="$(psql_q 'select count(*) from projects')"
          # payment_certificates is RLS-protected and FORCEd, so an unbound read
          # must return 0. A non-zero answer means the role can see through RLS.
          unbound="$(psql_q 'select count(*) from payment_certificates')"
          echo "companies:         $companies"
          echo "projects:          $projects"
          echo "unbound certs:     $unbound  (must be 0 - fail-closed)"
          [ "$companies" -ge 8 ] || { echo "::error::fixture not seeded: $companies companies"; exit 1; }
          [ "$projects" -ge 3 ]  || { echo "::error::fixture not seeded: $projects projects"; exit 1; }
          [ "$unbound" = "0" ]   || { echo "::error::RLS is not fail-closed - is epcc a superuser?"; exit 1; }

      - name: Prove the suite cannot reach the development database
        run: |
          set -euo pipefail
          psql_q() {
            docker compose exec -T -e PGPASSWORD=epcc_dev db \
              psql -U epcc -d epcc -tAc "$1"
          }
          # A table the migrations know nothing about. If the suite ever ran
          # against `epcc` instead of `epcc_test`, its migrate:fresh drops this.
          psql_q 'create table if not exists ci_sentinel (id int primary key);'
          psql_q 'insert into ci_sentinel values (1) on conflict do nothing;'
          echo "sentinel planted in the development database"

          docker compose exec -T app bash -c \
            'cd /srv/epcc/app && vendor/bin/phpunit --colors=never --filter SeedPathTest'

          survivors="$(psql_q 'select count(*) from ci_sentinel')"
          echo "sentinel rows after the suite ran: $survivors (must be 1)"
          [ "$survivors" = "1" ] || {
            echo "::error::the suite ran against the DEVELOPMENT database - a DB_* variable has leaked into the container environment (docs/DEVELOPMENT-ENVIRONMENT.md §6.1)"
            exit 1
          }

      - name: Dump the logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=250 app || true
          docker compose logs --tail=100 db || true
